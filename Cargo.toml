[package]
name = "cce-fx"
version = "0.1.0"
edition = "2021"

[lib]
doctest = false

[dependencies]
cce-ui = { git = "https://github.com/lsgalante/cce-ui.git", rev = "ff4b28942d78995587c3ab50bd7fd7ad4efe04d7" }
cce-window-manager = { git = "https://github.com/lsgalante/cce-window-manager.git", rev = "dfde58422441b56e4219147a6deea1ee1b099bea" }
xkbcommon = "0.7"
serde = { version = "1", features = ["derive"] }
nix = { version = "0.29", features = ["signal", "process", "fs", "poll", "resource"] }
libc = "0.2"
bitflags = "2"
tokio = { version = "1.35", features = ["full"] }
serde_json = "1.0"
kdl = "4.6"
png = "0.17"
fontdue = "0.9.3"
clap = { version = "4.4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"

[build-dependencies]
bindgen = "0.69"
pkg-config = "0.3"
cc = "1.0"

[[bin]]
name = "cce-fx"
path = "src/bin/cce.rs"

[profile.release]
debug = true


