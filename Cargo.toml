[package]
name = "cce-fx"
version = "0.1.0"
edition = "2021"

[lib]
doctest = false

[dependencies]
# The GUI-free half of the toolkit: config, input bindings, the animations
# switch and the relief/droplet spec parsers. It depended on cce-ui for these
# until 2026-10-07, linking the whole Wayland/Vulkan/text stack it never used.
cce-core = { git = "https://github.com/lsgalante/cce-core.git", rev = "5b8dcb30f1b0d7d607ab49d637069560eca0cb14" }
cce-window-manager = { git = "https://github.com/lsgalante/cce-window-manager.git", rev = "be6f99416a43c5ce9e944c052ca4fe7f790e7061" }
xkbcommon = "0.7"
serde = { version = "1", features = ["derive"] }
nix = { version = "0.29", features = ["signal", "process", "fs", "poll", "resource"] }
libc = "0.2"
# logind's sleep-delay inhibitor (`sleep_lock`).
zbus = "5"
serde_json = "1.0"
kdl = "4.6"
png = "0.17"
fontdue = "0.9.3"
clap = { version = "4.4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"

[build-dependencies]
bindgen = "0.69"
pkg-config = "0.3"
cc = "1.0"

[[bin]]
name = "cce-fx"
path = "src/bin/cce.rs"

[profile.release]
debug = true


