[package]
name = "clear-river"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["signal", "process", "fs", "poll", "resource"] }
bitflags = "2"
clap = { version = "4.4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"

[build-dependencies]
bindgen = "0.69"
cc = "1.0"
pkg-config = "0.3"

