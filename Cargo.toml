[package]
name = "clearwm"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "clearwm"
path = "src/main.rs"

[[bin]]
name = "clearctl"
path = "src/clearctl.rs"

[dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-scanner = "0.31"
xkbcommon = "0.7"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
nix = { version = "0.29", features = ["signal", "process", "fs"] }
libc = "0.2"
