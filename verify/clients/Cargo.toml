[package]
name = "cce-verify-clients"
version = "0.1.0"
edition = "2021"
description = "Wayland test clients for behavioral verification in cce-shadow sessions"

[[bin]]
name = "vkey"
path = "src/bin/vkey.rs"

[[bin]]
name = "status-stub"
path = "src/bin/status_stub.rs"

[[bin]]
name = "float-pair"
path = "src/bin/float_pair.rs"

[[bin]]
name = "popup-nest"
path = "src/bin/popup_nest.rs"

[[bin]]
name = "xembed-icon"
path = "src/bin/xembed_icon.rs"

[[bin]]
name = "or-flip"
path = "src/bin/or_flip.rs"

[[bin]]
name = "pointer-lock"
path = "src/bin/pointer_lock.rs"

[[bin]]
name = "or-focus"
path = "src/bin/or_focus.rs"

[[bin]]
name = "layer-popup"
path = "src/bin/layer_popup.rs"

[[bin]]
name = "input-probe"
path = "src/bin/input_probe.rs"

[[bin]]
name = "dnd-source"
path = "src/bin/dnd_source.rs"

[[bin]]
name = "x11-place"
path = "src/bin/x11_place.rs"

[[bin]]
name = "layer-bar"
path = "src/bin/layer_bar.rs"

[[bin]]
name = "vptr"
path = "src/bin/vptr.rs"

[[bin]]
name = "ime"
path = "src/bin/ime.rs"

[dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
xkbcommon = "0.8"
libc = "0.2"
x11rb = "0.13"

# Deliberately NOT a member of the cce workspace: these are test clients built
# on demand by verify/ scripts, invisible to ccebuild and `cargo build` at the
# workspace root. The empty table severs workspace resolution.
[workspace]
